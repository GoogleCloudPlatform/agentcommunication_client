name: run-go-checks

on:
  pull_request:
    branches: [ "main" ]

jobs:
  run_go_checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.21', '1.23.x' ]

    steps:
    - uses: actions/checkout@v4
    - name: Setup Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    # The VSOCK tests listen on the vsock loopback address, which needs the
    # vsock_loopback kernel module.
    - name: Load vsock_loopback
      run: sudo modprobe vsock_loopback

    - name: Test
      run: go test -v ./...